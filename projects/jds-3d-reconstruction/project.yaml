project_id: jds-3d-reconstruction
title: FastRelight：可编辑、可重打光的 4D 驾驶场景重建
status: active
scope: >-
  基于 OmniRe 的显式前景/背景分解，从同步多视角 RGB 与 LiDAR 构建天空、静态背景、
  刚性车辆、骨骼驱动行人和通用形变体五类 Gaussian 组件；以共享环境光、空间光照残差、
  材质先验和可见性/阴影建模支持对象级编辑与光照一致的重新组合。
