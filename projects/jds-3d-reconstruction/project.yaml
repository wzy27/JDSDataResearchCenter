project_id: jds-3d-reconstruction
title: 基于 OmniRe 的可编辑城市重建与重打光
status: active
scope: >-
  以 OmniRe 动态 Gaussian scene graph 为基线，分别完成行人/人体、车辆和静态场景重建，
  再加入统一重打光模块，使各实体能够独立编辑、重新组合，并在新光照下保持真实一致。
  原始归档、视频、数据集、模型权重和个人资料保留在外部对象存储，不进入本仓库。
